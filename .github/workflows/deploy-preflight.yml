name: Deploy preflight

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Mirrors Vercel exactly: fails if package-lock.json is out of sync
      # with package.json, or if a dependency has an incompatible peer range.
      - name: Install (npm ci, same as Vercel)
        run: npm ci --no-audit --no-fund

      - name: Verify lockfile is in sync
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code package-lock.json || {
            echo "::error::package-lock.json is out of sync with package.json. Run 'npm install' and commit the lockfile.";
            exit 1;
          }

      - name: Build
        run: npm run build
